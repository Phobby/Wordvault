<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Fake Video.js player (Wordvault captions test)</title>
    <!--
      An offline copy of the caption layer of a Video.js player, as Brightcove's player (Video.js
      8.23.4) draws it in Chrome and Firefox (read from the real player on 2026-10-23):

        .video-js
          video.vjs-tech
          .vjs-text-track-display          pointer-events: none
            div                            (inset; margin 1.5%)
              .vjs-text-track-cue[lang]    position: absolute; width: 100%; white-space: pre-line
                div                        display: inline; the text, rows separated by "\n"
          .vjs-control-bar

      window.fake:
        show(text)   Draws a caption (rows separated by "\n").
        redraw()     Draws the same text again with new elements, as Video.js does on resize.
        clear()      Removes the caption.
    -->
    <style>
      body { margin: 0; background: #181818; color: #ddd; font: 14px/1.4 sans-serif; }
      .video-js { position: relative; width: 854px; height: 480px; margin: 20px; background: #000; overflow: hidden; }
      .video-js:fullscreen { width: 100%; height: 100%; margin: 0; }
      .vjs-tech { position: absolute; inset: 0; width: 100%; height: 100%; }
      .vjs-text-track-display { position: absolute; inset: 0 0 3em 0; pointer-events: none; }
      .vjs-control-bar { position: absolute; left: 0; right: 0; bottom: 0; height: 3em; background: rgba(43, 51, 63, 0.7); }
      p { margin: 0 20px; }
    </style>
  </head>
  <body>
    <div class="video-js vjs-default-skin vjs-v8 vjs-has-started vjs-paused" id="player">
      <video class="vjs-tech" tabindex="-1"></video>
      <div class="vjs-text-track-display" translate="yes" aria-live="off" aria-atomic="true">
        <div style="position: absolute; inset: 0px; margin: 1.5%"></div>
      </div>
      <div class="vjs-control-bar" dir="ltr"></div>
    </div>
    <p>A page with a Video.js player, like Cisco's course pages.</p>
    <script>
      const layer = document.querySelector('.vjs-text-track-display > div');
      let current = '';
      function draw(text) {
        layer.textContent = '';
        if (!text) return;
        const cue = document.createElement('div');
        cue.className = 'vjs-text-track-cue vjs-text-track-cue-en';
        cue.lang = 'en';
        cue.style.cssText = 'direction: ltr; writing-mode: horizontal-tb; unicode-bidi: plaintext; text-align: center; font: 28px sans-serif; white-space: pre-line; position: absolute; width: 100%; left: 0px; right: 0px; bottom: 0px; background-color: rgba(0, 0, 0, 0);';
        const inner = document.createElement('div');
        inner.style.cssText = 'color: rgb(255, 255, 255); background-color: rgb(0, 0, 0); position: relative; inset: 0px; display: inline; writing-mode: horizontal-tb; unicode-bidi: plaintext; font-family: sans-serif;';
        inner.textContent = text;
        cue.append(inner);
        layer.append(cue);
      }
      window.fake = {
        show(text) { current = text; draw(text); },
        redraw() { draw(current); },
        clear() { current = ''; draw(''); },
      };
      fake.show('Configure the router interface\nwith an IPv4 address.');
    </script>
  </body>
</html>
